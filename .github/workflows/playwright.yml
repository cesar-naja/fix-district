name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Browser tests need the dedicated Clerk test application's keys, which
    # forks never receive. Skip forked pull requests instead of failing them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Production build and start, as the Next.js docs recommend for E2E.
      E2E_SERVER_MODE: build
      # Keys of the DEDICATED Clerk test application (development instance).
      # Never put live keys or a personal application's keys here.
      E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_FRONTEND_API: ${{ secrets.E2E_CLERK_FRONTEND_API }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    # The Firestore emulator needs Java 21+.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    # One root package-lock.json covers the app and the e2e workspace.
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser
      run: npm exec -w @fix-district/e2e -- playwright install --with-deps chromium
    # Root script -> e2e workspace: starts the Firestore emulator (demo project,
    # port 8086), then runs Playwright, which builds and starts the app against it.
    - name: Run Playwright tests
      run: npm run test:e2e
    # Reports can contain screenshots and request details. Keep them short-lived.
    # Traces are off in CI unless E2E_TRACE is set.
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 3
